{{ $home := site.Home.RelPermalink }}
<div class="topbar">
  <div class="wrap">
    <div class="tb-left"><span class="star">★</span> {{ .Site.Params.serviceArea }}</div>
    <div class="tb-right">
      <span><span class="star">★★★★★</span> {{ .Site.Params.rating }}</span>
      <a href="tel:{{ .Site.Params.phoneHref }}">{{ .Site.Params.phone }}</a>
    </div>
  </div>
</div>

<header>
  <div class="wrap nav">
    <a class="brand" href="{{ $home }}">
      <img src="{{ "images/newsong-logo.png" | relURL }}" alt="NewSong Renovations">
    </a>
    <nav class="navlinks">
      <a href="{{ "services/" | relURL }}">Services</a>
      <a href="{{ "service-area/" | relURL }}">Service Area</a>
      <a href="{{ "about/" | relURL }}">About Us</a>
      <a href="{{ "our-work/" | relURL }}">Our Work</a>
    </nav>
    <div class="navcta">
      <span class="navphone">{{ .Site.Params.phone }}</span>
      <a class="btn btn-yellow" href="{{ "contact/" | relURL }}">Schedule a Call</a>
    </div>
  </div>
</header>
